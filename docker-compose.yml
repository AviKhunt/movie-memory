# local postgres: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movie_memory
    ports:
      - "5432:5432"
    volumes:
      - movie-memory-db:/var/lib/postgresql/data

volumes:
  movie-memory-db:
